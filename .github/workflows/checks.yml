name: Simulator checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start a virtual audio output
        run: |
          sudo apt-get install -y pulseaudio
          pactl info > /dev/null || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=flight_deck
          pactl set-default-sink flight_deck
      - run: xvfb-run -a npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
