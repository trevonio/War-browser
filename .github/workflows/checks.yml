name: Simulator checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
